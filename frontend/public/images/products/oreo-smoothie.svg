<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7F7F7"/><stop offset="100%" stop-color="#E5E5E5"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBEBEB"/><stop offset="50%" stop-color="#9C9895"/><stop offset="100%" stop-color="#3B3633"/>
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="straw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D35400"/>
      <stop offset="50%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#BA4A00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#191614" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>

  <!-- Straw -->
  <path d="M 115 15 L 125 15 L 105 130 L 95 130 Z" fill="url(#straw)"/>
  <ellipse cx="120" cy="15" rx="5" ry="2" fill="#E67E22"/>

  <!-- Cup Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Liquid -->
    <path d="M 64 68 L 136 68 L 127 166 C 126 172 120 176 113 176 L 87 176 C 80 176 74 172 73 166 Z" fill="url(#liquid)"/>

    

    

    <!-- Ice Cubes -->
    <rect x="78" y="75" width="18" height="18" rx="4" fill="#ffffff" opacity="0.35" transform="rotate(12 87 84)"/>
    <rect x="104" y="80" width="18" height="18" rx="4" fill="#ffffff" opacity="0.3" transform="rotate(-15 113 89)"/>

    <!-- Cup Glass Plastic Container -->
    <path d="M 60 55 L 140 55 L 129 168 C 128 175 121 180 114 180 L 86 180 C 79 180 72 175 71 168 Z" fill="url(#cup)"/>
    
    <!-- Cup Rim & Lid -->
    <ellipse cx="100" cy="55" rx="40" ry="6" fill="#ffffff" opacity="0.5"/>
    <ellipse cx="100" cy="53" rx="42" ry="7" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75"/>
    <ellipse cx="100" cy="51" rx="42" ry="7" fill="#ffffff" opacity="0.25"/>

    <!-- Glass Reflection Highlight -->
    <path d="M 68 70 L 75 70 L 80 165 L 75 165 Z" fill="#ffffff" opacity="0.25"/>
  </g>
</svg>